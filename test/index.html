<input type="button" onclick="disconnect()" value="断开" />
<input type="button" onclick="getdata1()" value="获取数据1" />
<input type="button" onclick="getdata2()" value="获取数据2" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
    integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
    crossorigin="anonymous"></script>
<script type="text/javascript" charset="utf-8">
    var socket = io();
    socket.on('connect', function () {
        socket.emit('my event', { data: 'I\'m connected!' });
        socket.send('json', { data: '我连上来了' });
    });
    function disconnect() {
        socket.disconnect();
        socket.close();
    }

    function getdata1() {
        socket.emit('GetData', '0.002902,1.600833');
    }
    function getdata2() {
        socket.emit('GetData', '0.003031,0.300274');
    }
    socket.on('dataMsg', function (msg) {
        console.log(msg);
    });
</script>
